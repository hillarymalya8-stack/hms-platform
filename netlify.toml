[build]
  command = "npm run build:netlify"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The HMS API (NestJS + Prisma) is compiled with tsc during the build; nft keeps its decorator
# metadata intact and ships the Prisma query engine built for the Netlify Functions runtime.
[functions.api]
  node_bundler = "nft"
  included_files = [
    "apps/api/dist/**",
    "node_modules/.prisma/client/**",
    "!node_modules/.prisma/client/libquery_engine-debian-*",
    "node_modules/@prisma/client/**"
  ]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
