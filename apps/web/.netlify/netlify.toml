headersOrigin = "inline"
redirectsOrigin = "inline"
functionsDirectory = "/opt/build/repo/netlify/functions"
functionsDirectoryOrigin = "config"

[functions]

[functions.api]
node_bundler = "nft"
included_files = ["apps/api/dist/**", "node_modules/.prisma/client/**", "!node_modules/.prisma/client/libquery_engine-debian-*", "!node_modules/.prisma/client/libquery_engine-rhel-openssl-1.0.x*", "!node_modules/.prisma/client/**/*.d.ts", "!node_modules/.prisma/client/deno/**", "node_modules/@prisma/client/**", "!node_modules/@prisma/client/**/*.d.ts", "!node_modules/@prisma/client/runtime/*mysql*", "!node_modules/@prisma/client/runtime/*sqlite*", "!node_modules/@prisma/client/runtime/*cockroachdb*", "!node_modules/@prisma/client/runtime/*sqlserver*"]

[functions."*"]
node_bundler = "esbuild"

[[plugins]]
origin = "default"
package = "@netlify/plugin-nextjs"
pinned_version = "5"

[plugins.inputs]

[build]
publish = "/opt/build/repo/apps/web/.next"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build:netlify"
functions = "/opt/build/repo/netlify/functions"

[build.environment]
NODE_VERSION = "20"
NEXT_TELEMETRY_DISABLED = "1"
NETLIFY_NEXT_SKEW_PROTECTION = "true"

[build.processing]

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
for = "/_next/static/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
from = "/_next/image"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200.0
force = false

[redirects.query]
url = ":url"
w = ":width"
q = ":quality"

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/_ipx/*"
to = "/.netlify/images?url=:url&w=:width&q=:quality"
status = 200.0
force = false

[redirects.query]
url = ":url"
w = ":width"
q = ":quality"

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/_next/image"
to = "/.netlify/images"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]